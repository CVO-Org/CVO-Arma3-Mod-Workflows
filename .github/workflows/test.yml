name: Test

on:
  workflow_call:
    inputs:
      framework-ref:
        description: Immutable tag or commit used to reference this reusable workflow
        required: true
        type: string
      sqfvm-version:
        description: SQF-VM GitHub release tag to install
        required: false
        type: string
        default: v2026.04.03-ed9f5f5
      project-root:
        description: Project root relative to the caller repository workspace
        required: false
        type: string
        default: .
      config-path:
        description: Optional framework configuration path relative to project root
        required: false
        type: string
        default: ''
      fail-on-skipped:
        description: Fail when SQF-VM test execution is skipped
        required: false
        type: boolean
        default: true


    secrets:
      framework-token:
        description: Fine-grained token with contents:read access to the private framework repository
        required: true

permissions:
  contents: read

jobs:
  test:
    name: SQF-VM runtime tests
    runs-on: windows-latest
    steps:
      - name: Check out consuming project
        uses: actions/checkout@v5

      - name: Check out framework at the pinned revision
        uses: actions/checkout@v5
        with:
          repository: SkippieDippie/Arma3-Mod-Workflows
          ref: ${{ inputs['framework-ref'] }}
          path: .arma3-workflows
          token: ${{ secrets.framework-token }}
          persist-credentials: false

      - name: Install SQF-VM
        shell: pwsh
        env:
          SQFVM_VERSION: ${{ inputs['sqfvm-version'] }}
        run: |
          if ($env:SQFVM_VERSION -notmatch '^[A-Za-z0-9._-]+$') {
            throw "Invalid SQF-VM release tag '$env:SQFVM_VERSION'."
          }

          $releaseApi = "https://api.github.com/repos/SQFvm/runtime/releases/tags/$($env:SQFVM_VERSION)"
          $release = Invoke-RestMethod -Uri $releaseApi -Headers @{
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $asset = @($release.assets | Where-Object { $_.name -eq 'sqfvm_windows_x64.zip' }) | Select-Object -First 1
          if (-not $asset) {
            throw "SQF-VM release '$env:SQFVM_VERSION' does not contain sqfvm_windows_x64.zip."
          }
          if ([string]$asset.digest -notmatch '^sha256:[a-fA-F0-9]{64}$') {
            throw "SQF-VM release '$env:SQFVM_VERSION' does not publish a valid SHA-256 digest for its Windows x64 archive."
          }

          $archive = Join-Path $env:RUNNER_TEMP 'sqfvm_windows_x64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'sqfvm'
          $downloadUrl = "https://github.com/SQFvm/runtime/releases/download/$($env:SQFVM_VERSION)/sqfvm_windows_x64.zip"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
          $actualDigest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          $expectedDigest = ($asset.digest -split ':', 2)[1]
          if ($actualDigest -ine $expectedDigest) {
            throw "SQF-VM archive SHA-256 mismatch. Expected $expectedDigest, received $actualDigest."
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force

          $executable = Get-ChildItem -LiteralPath $destination -File -Recurse |
            Where-Object { $_.Name -in @('sqfvm.exe', 'sqfvm_x64.exe') } |
            Select-Object -First 1
          if (-not $executable) {
            throw "SQF-VM archive '$downloadUrl' did not contain sqfvm.exe or sqfvm_x64.exe."
          }

          Add-Content -LiteralPath $env:GITHUB_PATH -Value $executable.DirectoryName
          Write-Host "Installed SQF-VM from release $env:SQFVM_VERSION at $($executable.FullName)."

      - name: Run configured SQF-VM test scripts
        shell: pwsh
        env:
          FRAMEWORK_SCRIPT: ${{ github.workspace }}/.arma3-workflows/src/Invoke-Arma3ModWorkflows.ps1
          PROJECT_ROOT: ${{ inputs['project-root'] }}
          CONFIG_PATH: ${{ inputs['config-path'] }}
          FAIL_ON_SKIPPED: ${{ inputs['fail-on-skipped'] }}
        run: |
          $arguments = @(
            '-ProjectRoot', $env:PROJECT_ROOT,
            '-Operation', 'Test',
            '-Module', 'Testing.SQFVM'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:CONFIG_PATH)) {
            $arguments += @('-ConfigPath', $env:CONFIG_PATH)
          }

          $output = & pwsh -NoProfile -NonInteractive -File $env:FRAMEWORK_SCRIPT @arguments 2>&1 | Out-String
          $frameworkExitCode = $LASTEXITCODE

          try {
            $results = @($output | ConvertFrom-Json -ErrorAction Stop)
          }
          catch {
            throw "Framework CLI did not return valid JSON (exit code $frameworkExitCode). Output: $output"
          }

          $skipped = @($results | Where-Object { $_.Status -eq 'Skipped' })
          if ($env:FAIL_ON_SKIPPED -eq 'true' -and $skipped.Count -gt 0) {
            $details = @($skipped | ForEach-Object { "$($_.Module): $($_.Summary)" }) -join '; '
            throw "SQF-VM test execution was skipped: $details"
          }

          if ($frameworkExitCode -ne 0) {
            throw "SQF-VM test execution failed with exit code $frameworkExitCode. Output: $output"
          }
