name: Core tests

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-core:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PowerShell modules
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Parse and test core
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1
