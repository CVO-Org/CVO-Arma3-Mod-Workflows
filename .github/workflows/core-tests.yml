name: Core tests

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  workflow-lint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run actionlint
        uses: reviewdog/action-actionlint@6c5efc3e507f3a0678fe69e82423dfe41edc86b8
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: error

  powershell-core:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PowerShell modules
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Parse and test core
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Windows PowerShell 5.1 compatibility
        shell: powershell
        run: ./tests/PowerShell51-Compatibility.ps1
