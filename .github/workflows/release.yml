name: Release

on:
  workflow_call:
    inputs:
      release-tag:
        description: Existing release tag from the caller's release event
        required: true
        type: string
      project-root:
        description: Mod project root relative to the caller workspace
        required: false
        type: string
        default: .
      hemtt-version:
        description: HEMTT version to install
        required: false
        type: string
        default: v1.21.0
      version-header-path:
        description: Project-relative script_version.hpp path
        required: false
        type: string
        default: addons/main/script_version.hpp
      meta-file-path:
        description: Project-relative meta.cpp path
        required: false
        type: string
        default: meta.cpp
      workshop-id:
        description: Existing Steam Workshop item ID
        required: true
        type: string
      workshop-name:
        description: Workshop display name written to meta.cpp
        required: true
        type: string
      release-folder:
        description: Release folder prefix, including any leading @
        required: true
        type: string
      publish-github:
        description: Attach the packaged ZIP to the triggering GitHub Release
        required: false
        type: boolean
        default: true
      publish-steam:
        description: Upload the release folder to Steam Workshop
        required: false
        type: boolean
        default: true
      prerelease:
        description: Preserve the GitHub Release prerelease state
        required: false
        type: boolean
        default: false
    secrets:
      steam_username:
        description: Steam account username for Workshop upload
        required: false
      steam_password:
        description: Steam account password for Workshop upload
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish ${ inputs['release-folder'] }
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged project source
        uses: actions/checkout@v4
        with:
          ref: ${ inputs['release-tag'] }
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release configuration
        shell: pwsh
        env:
          RELEASE_TAG: ${ inputs['release-tag'] }
          WORKSHOP_ID: ${ inputs['workshop-id'] }
          WORKSHOP_NAME: ${ inputs['workshop-name'] }
          RELEASE_FOLDER: ${ inputs['release-folder'] }
          PUBLISH_GITHUB: ${ inputs['publish-github'] }
          PUBLISH_STEAM: ${ inputs['publish-steam'] }
          STEAM_USERNAME: ${ secrets.steam_username }
          STEAM_PASSWORD: ${ secrets.steam_password }
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:[-+][0-9A-Za-z.-]+|\.RC\..*)?$') {
            throw "Release tag '$env:RELEASE_TAG' is not a supported version tag."
          }
          if ($env:WORKSHOP_ID -notmatch '^[0-9]+$') {
            throw 'workshop-id must be a numeric existing Workshop item ID.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WORKSHOP_NAME) -or $env:WORKSHOP_NAME.Contains('"')) {
            throw 'workshop-name must be non-empty and must not contain a double quote.'
          }
          if ($env:RELEASE_FOLDER -match '[/\\]' -or [string]::IsNullOrWhiteSpace($env:RELEASE_FOLDER)) {
            throw 'release-folder must be a folder name, not a path.'
          }
          if ($env:PUBLISH_GITHUB -ne 'true' -and $env:PUBLISH_STEAM -ne 'true') {
            throw 'At least one release destination must be enabled.'
          }
          if ($env:PUBLISH_STEAM -eq 'true' -and
              ([string]::IsNullOrWhiteSpace($env:STEAM_USERNAME) -or [string]::IsNullOrWhiteSpace($env:STEAM_PASSWORD))) {
            throw 'STEAM_USERNAME and STEAM_PASSWORD secrets are required for Steam publishing.'
          }

      - name: Set up HEMTT
        uses: arma-actions/hemtt@a0570ddd80d2b7be9c0f052494c0f700b42668dd
        with:
          version: ${ inputs['hemtt-version'] }

      - name: Prepare version header and Workshop metadata
        shell: pwsh
        working-directory: ${ inputs['project-root'] }
        env:
          RELEASE_TAG: ${ inputs['release-tag'] }
          VERSION_HEADER_PATH: ${ inputs['version-header-path'] }
          META_FILE_PATH: ${ inputs['meta-file-path'] }
          WORKSHOP_ID: ${ inputs['workshop-id'] }
          WORKSHOP_NAME: ${ inputs['workshop-name'] }
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)(?:[-+][0-9A-Za-z.-]+|\.RC\..*)?$') {
            throw "Cannot extract semantic version from '$env:RELEASE_TAG'."
          }
          $versionParts = $Matches
          $versionFile = Join-Path (Get-Location) $env:VERSION_HEADER_PATH
          if (-not (Test-Path -LiteralPath $versionFile -PathType Leaf)) {
            throw "Version header not found: $versionFile"
          }
          $content = Get-Content -LiteralPath $versionFile -Raw
          foreach ($part in @('major', 'minor', 'patch')) {
            $pattern = "(?m)^#define\s+$($part.ToUpperInvariant())\s+.*$"
            $defineMatches = [regex]::Matches($content, $pattern)
            if ($defineMatches.Count -ne 1) {
              throw "Expected exactly one #define $($part.ToUpperInvariant()) in $versionFile; found $($defineMatches.Count)."
            }
            $content = [regex]::Replace($content, $pattern, "#define $($part.ToUpperInvariant()) $($versionParts[$part])")
          }
          Set-Content -LiteralPath $versionFile -Value $content -Encoding utf8

          $metaFile = Join-Path (Get-Location) $env:META_FILE_PATH
          $metaDirectory = Split-Path -Parent $metaFile
          if (-not [string]::IsNullOrWhiteSpace($metaDirectory)) {
            New-Item -ItemType Directory -Path $metaDirectory -Force | Out-Null
          }
          $ticks = [DateTime]::UtcNow.Ticks
          $meta = @"
          protocole = 1;
          publishedid = $env:WORKSHOP_ID;
          name = "$env:WORKSHOP_NAME";
          timestamp = $ticks;
          "@
          Set-Content -LiteralPath $metaFile -Value $meta -Encoding utf8
          Write-Host "Prepared version $($versionParts['major']).$($versionParts['minor']).$($versionParts['patch']) for Workshop item $env:WORKSHOP_ID."

      - name: Build HEMTT release
        shell: bash
        working-directory: ${ inputs['project-root'] }
        run: hemtt release --no-archive

      - name: Package release folder
        shell: pwsh
        working-directory: ${ inputs['project-root'] }
        env:
          RELEASE_TAG: ${ inputs['release-tag'] }
          RELEASE_FOLDER: ${ inputs['release-folder'] }
        run: |
          $source = Join-Path (Get-Location) '.hemttout/release'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            throw "HEMTT release output not found: $source"
          }
          $addons = Join-Path $source 'addons'
          if (-not (Test-Path -LiteralPath $addons -PathType Container) -or
              @(Get-ChildItem -LiteralPath $addons -Filter '*.pbo' -File -Recurse).Count -eq 0) {
            throw "HEMTT output must contain at least one PBO under $addons."
          }
          $destination = Join-Path (Get-Location) "$($env:RELEASE_FOLDER)-$($env:RELEASE_TAG)"
          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          Move-Item -LiteralPath $source -Destination $destination
          $archive = "$destination.zip"
          Compress-Archive -LiteralPath $destination -DestinationPath $archive -CompressionLevel Optimal
          Write-Host "Packaged $destination"

      - name: Attach ZIP to GitHub Release draft
        if: ${ inputs['publish-github'] }
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: ${ inputs['release-tag'] }
          draft: true
          prerelease: ${ inputs.prerelease }
          files: ${ inputs['project-root'] }/${ inputs['release-folder'] }-${ inputs['release-tag'] }.zip
          fail_on_unmatched_files: true

      - name: Upload to Steam Workshop
        if: ${ inputs['publish-steam'] }
        uses: arma-actions/workshop-upload@v1
        with:
          itemId: ${ inputs['workshop-id'] }
          contentPath: ${ inputs['project-root'] }/${ inputs['release-folder'] }-${ inputs['release-tag'] }
          changelog: https://github.com/${ github.repository }}/releases/tag/${ inputs['release-tag'] }
        env:
          STEAM_USERNAME: ${ secrets.steam_username }
          STEAM_PASSWORD: ${ secrets.steam_password }

      - name: Publish GitHub Release
        if: ${ inputs['publish-github'] }
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: ${ inputs['release-tag'] }
          draft: false
          prerelease: ${ inputs.prerelease }
